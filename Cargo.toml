[package]
name = "sh-quant"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = "0.4"
rayon = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rss = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[profile.release]
debug = false
